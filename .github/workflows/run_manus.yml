name: Run OpenManus Bot

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'اكتب هنا تفاصيل مشروعك أو المهمة التي تريد من البوت تنفيذها'
        required: true
        default: 'اكتب كود بايثون بسيط لحساب عمر المستخدم'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run OpenManus Task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py --prompt "${{ github.event.inputs.prompt }}"
